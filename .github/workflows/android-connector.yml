# dartAndroidMqttConnector: signiertes Release-APK
#   Pull Request → nur Versionsprüfung (kein Build): schlägt fehl, wenn
#                  android-connector-v<version> schon existiert (appVersion erhöhen!)
#   Merge master → Release-APK bauen, signieren und als GitHub-Release
#                  android-connector-v<version> veröffentlichen
# Benötigte Secrets im Environment "release" (Release-Keystore, immer derselbe — sonst lassen sich
# Updates nicht über eine installierte Version installieren):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: android-connector

on:
  pull_request:
    branches: [master]
    paths:
      - 'dart-board-connector/dartAndroidMqttConnector/**'
      - '!dart-board-connector/dartAndroidMqttConnector/**/*.md'
  push:
    branches: [master]
    paths:
      - 'dart-board-connector/dartAndroidMqttConnector/**'
      - '!dart-board-connector/dartAndroidMqttConnector/**/*.md'

concurrency:
  # PR-Nummer statt ref: Läufe zu bereits gemergten PRs bekommen ref=master und
  # würden sonst den Release-Lauf auf master abbrechen
  group: android-connector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dart-board-connector/dartAndroidMqttConnector
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag-exists: ${{ steps.version.outputs.tag-exists }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Version bestimmen
        run: |
          version="$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          [[ -n "$version" ]] || { echo "::error::appVersion in app/build.gradle.kts nicht gefunden"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/android-connector-v$version" >/dev/null; then
            tag_exists=true
          else
            tag_exists=false
          fi
          {
            echo "version=$version"
            echo "tag-exists=$tag_exists"
          } >> "$GITHUB_OUTPUT"
          echo "android-connector $version (Tag android-connector-v$version existiert: $tag_exists)"

      - name: Versionsprüfung
        if: github.event_name == 'pull_request' && steps.version.outputs.tag-exists == 'true'
        run: |
          echo "::error file=dart-board-connector/dartAndroidMqttConnector/app/build.gradle.kts::android-connector-v${{ steps.version.outputs.version }} ist bereits veröffentlicht — appVersion erhöhen."
          exit 1

      - name: Kein neues Release
        if: github.event_name == 'push' && steps.version.outputs.tag-exists == 'true'
        run: echo "::warning::android-connector-v${{ steps.version.outputs.version }} existiert bereits — kein neues Release (Version nicht erhöht?)."

  release:
    needs: version
    if: github.event_name == 'push' && needs.version.outputs.tag-exists == 'false'
    runs-on: ubuntu-24.04
    # Secrets liegen im Environment "release" (nur für master freigegeben)
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: dart-board-connector/dartAndroidMqttConnector
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Keystore bereitstellen
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt — siehe dart-board-connector/dartAndroidMqttConnector/README.md."
            exit 1
          fi
          base64 -d <<<"$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "dartAndroidMqttConnector-$VERSION.apk"

      - name: GitHub-Release erstellen
        run: |
          prev="$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
                  | sed -n 's/^android-connector-v//p' | sort -V | tail -1)"
          notes=(--generate-notes)
          [[ -n "$prev" ]] && notes+=(--notes-start-tag "android-connector-v$prev")
          gh release create "android-connector-v$VERSION" "dartAndroidMqttConnector-$VERSION.apk" \
            --target "$GITHUB_SHA" --title "Android-Dartboard-Connector $VERSION" --latest=false "${notes[@]}"
